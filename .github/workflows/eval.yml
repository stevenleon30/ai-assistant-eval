name: Eval Suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run eval suite
        run: promptfoo eval --config promptfooconfig.yaml -o results.json || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Enforce weighted pass-rate threshold
        run: node scripts/check-threshold.js results.json 0.85

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json

      - name: Comment results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('results.json')) return;
            const results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            const stats = results.results?.stats || results.stats;
            if (!stats) return;
            const total = stats.successes + stats.failures;
            const passRate = ((stats.successes / total) * 100).toFixed(1);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Eval Suite Results:** ${stats.successes}/${total} passed (${passRate}%)`
            });
